name: "clang-tidy-check"

permissions:
  contents: write
  pull-requests: write
#  metadata: read

on:
  push:
    branches:
    - master

    # This specifically builds when anything relating to a build changes.
    # Everything else can be ignored.
    paths:
      - '.github/workflows/clang-tidy-check.yml'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.inl'

  pull_request:
    branches:
    - master

    # This specifically builds when anything relating to a build changes.
    # Everything else can be ignored.
    paths:
      - '.github/workflows/clang-tidy-check.yml'
      - '**/CMakeLists.txt'
      - '**/*.cmake'
      - '**/*.cpp'
      - '**/*.h'
      - '**/*.hpp'
      - '**/*.inl'

  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref || github.run_id }}"
  cancel-in-progress: true
  
jobs:
  lint_windows:
    runs-on: windows-latest

    strategy:
      matrix:
        BUILD_CONFIGURATION: [Debug]
        BUILD_PLATFORM: [x64]

    name: "${{ matrix.BUILD_CONFIGURATION }} - ${{ matrix.BUILD_PLATFORM }} (Windows)"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'false'

    - uses: ilammy/msvc-dev-cmd@v1

    - uses: lukka/get-cmake@latest

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -S . `
          -B build-windows-${{ matrix.BUILD_CONFIGURATION }}-${{ matrix.BUILD_PLATFORM }} `
          -G "Ninja" `
          -DCMAKE_BUILD_TYPE=${{ matrix.BUILD_CONFIGURATION }} `
          -DOPENKO_FETCH_CLIENT_ASSETS=FALSE `
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON `
          -DCMAKE_DISABLE_PRECOMPILE_HEADERS=TRUE
        
    - uses: cpp-linter/cpp-linter-action@v2
      name: "Run linter (pull)"
      if: github.event_name == 'pull'
      id: linter_pull
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        version: "19"
        database: "build-windows-${{ matrix.BUILD_CONFIGURATION }}-${{ matrix.BUILD_PLATFORM }}"
        ignore: "build-windows-${{ matrix.BUILD_CONFIGURATION }}-${{ matrix.BUILD_PLATFORM }}"
        style: "" # disable clang-format checks. (1)
        tidy-checks: "" # Use .clang-tidy config file. (2)
        lines-changed-only: true
        extensions: "c,cpp"
        tidy-review: false
        passive-reviews: false
        step-summary: true
        thread-comments: false

    - uses: cpp-linter/cpp-linter-action@v2
      name: "Run linter (PR review)"
      if: github.event_name == 'pull_request'
      id: linter_pr
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        version: "19"
        database: "build-windows-${{ matrix.BUILD_CONFIGURATION }}-${{ matrix.BUILD_PLATFORM }}"
        ignore: "build-windows-${{ matrix.BUILD_CONFIGURATION }}-${{ matrix.BUILD_PLATFORM }}"
        style: "" # disable clang-format checks. (1)
        tidy-checks: "" # Use .clang-tidy config file. (2)
        lines-changed-only: true
        extensions: "c,cpp"
        tidy-review: "update"
        passive-reviews: false
        step-summary: true
        thread-comments: "update"

    - name: Check clang-tidy result (pull)
      if: github.event_name == 'pull' && steps.linter_pull.outputs.clang-tidy-checks-failed > 0
      run: exit 1

    - name: Check clang-tidy result (pull_request)
      if: github.event_name == 'pull_request' && steps.linter_pr.outputs.clang-tidy-checks-failed > 0
      run: exit 1
